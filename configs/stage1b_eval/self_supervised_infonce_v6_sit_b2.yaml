# v6: source-aware selection + source Lab patch SWD; texture is validation-only.
# Fit 0.55 / projection 0.25. Other v4.5 objectives and optimizer settings retained.
source_aware_selection:
  enabled: true
  spatial_weight: 0.25
  appearance_weight: 0.25
  appearance_size: 8
  calibration: fixed_train_row_centered_rms
  eps: 1.0e-08
  min_calibration_spread: 1.0e-06
spatial_correlative_cost:
  enabled: true
  feature_source: own_encoder
  layers: [0, 1]
  grid_size: 8
  spatial_center: true
  channel_normalize: true
  exclude_diagonal: true
  comparison: symmetric_row_cosine
  mixing_weight: 0.20
  calibration: fixed_train_centered_rms
  detach: true
  eps: 1.0e-06
  min_calibration_spread: 1.0e-06
projection_rms:
  mode: reference_ema
  decay: 0.99
  eps: 1.0e-08
stage: stage1b_eval_quick
project_root: /data/not_backed_up/yxu209/diffusion-ot/
output_dir: outputs/stage1b_eval_nce_v6
seed: 20260906
alignment_device: cuda:0
data:
  reference_split: train
  projection_split: train
  query_split: val
  reference_samples_per_domain: 224
  projection_samples_per_domain: 224
  query_samples_per_domain: 256
  batch_size: 32
  num_workers: 4
  pin_memory: true
proxy_labels:
  attributes: []
matching:
  normalize: l2
  distance_scale: infoot_rms
  bandwidth_multiplier: 0.55
  projection_bandwidth_multiplier: 0.25
infoot:
  variant: fused
  cross_cost_source: encoder
  cross_cost_weight: 1.0
  algorithm: official_projected_sinkhorn
  mi_weight: 0.1
  entropy_epsilon: 0.02
  inner_iterations: 1200
  recovery_iterations: 4800
  projection_iterations: 10000
  projection_tolerance: 1.0e-05
  outer_tolerance: 1.0e-05
  min_inner_iterations: 5
  outer_patience: 3
  strict_convergence: true
  require_outer_convergence: true
  initialization: independent_product
  numerical_epsilon: 1.0e-08
projection:
  directions:
  - cat_to_dog
  - dog_to_cat
reconstruction:
  enabled: true
  samples_per_domain: 32
  num_steps: 20
  guidance_scale: 1.0
  metrics:
  - latent_mse
  - pixel_mse
  - pixel_psnr
translation:
  teacher_free_image_metrics: true
  patchnce_metrics: false
  enabled: true
  decoded_structure_metrics: false
  include_source: true
  include_top1_target: true  # Three rows: source, real top-1 target, conditional-mean translation.
  include_structure_teacher_mean: false
  samples_per_direction: 16
  num_steps: 20
  guidance_scale: 1.0
  readouts:
  - conditional_mean
  primary_readout: conditional_mean
  temperature: 1.0
comparison:
  require_stage1a_baseline: false
projection_audit:
  enabled: true  # Numeric controls persist even when visualization.enabled is false.
visualization:
  enabled: true
  method: umap
  random_state: 20260906
  n_jobs: 1
  n_neighbors: 15
  min_dist: 0.1
  target_alpha: 0.3
  projection_alpha: 0.9
