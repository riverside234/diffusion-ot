stage: stage1b_eval_quick
project_root: /data/not_backed_up/yxu209/diffusion-ot/
output_dir: outputs/stage1b_eval_infoot_official_cfg_adaln_all_lora_r64
seed: 20260906
alignment_device: cuda:0

data:
  reference_split: train
  # Eq. (7) is fit on the reference subset and averaged over this larger bank.
  projection_split: train
  query_split: val
  gallery_split: val
  reference_samples_per_domain: 512
  projection_samples_per_domain: all
  query_samples_per_domain: 256
  gallery_samples_per_domain: 256
  batch_size: 32
  num_workers: 4
  pin_memory: true

# JSONL rows: {"sample_id": "...", "viewpoint": "front", "framing": "close"}.
# Set path to populate UMAP colors and proxy precision. When absent, the panels
# explicitly show "unlabeled" and their precision captions report n/a.
proxy_labels:
  path: null
  attributes: [viewpoint, framing]
  sample_id_key: sample_id

matching:
  normalize: l2
  # Match InfoOT.compute_kernel on the transported reference bank.
  distance_scale: infoot_rms
  # Plain InfoOT uses h=0.55 for separately trained embedding spaces in the
  # paper. With the official RMS distance scale above, this also avoids the nearly
  # constant kernels produced by h=1.0 in the Stage 1A baseline.
  bandwidth_multiplier: 0.55
  # Conditional retrieval and Eq. (7) readouts only; null inherits the fit
  # bandwidth above. Try 0.30, 0.40, 0.55 with the same fitting settings.
  # CLI override: --projection-bandwidth 0.40
  projection_bandwidth_multiplier: null

infoot:
  algorithm: official_projected_sinkhorn
  mi_weight: 1.0
  entropy_epsilon: 0.02
  inner_iterations: 100
  projection_iterations: 300
  projection_tolerance: 0.00001
  initialization: independent_product
  numerical_epsilon: 0.00000001

retrieval:
  k: [1, 5, 15]
  directions: [cat_to_dog, dog_to_cat]
  rules: [random, conditional, nn_plan_row, nn_barycentric]

reconstruction:
  enabled: true
  samples_per_domain: 8
  num_steps: 50
  guidance_scale: 1.0
  metrics: [latent_mse, pixel_mse, pixel_psnr, lpips]

translation:
  enabled: true
  samples_per_direction: 8
  num_steps: 50
  guidance_scale: 1.0
  readouts: [conditional_mean, conditional_map, conditional_sample]
  primary_readout: conditional_mean
  temperature: 1.0

comparison:
  # A Stage 1B report is only valid against the same versioned Stage 1A protocol.
  require_stage1a_baseline: true

visualization:
  enabled: true
  method: umap
  random_state: 20260906
  # A fixed seed makes UMAP deterministic and therefore single-threaded.
  n_jobs: 1
  # Target-bank points remain translucent while larger, outlined projection
  # markers stay legible over dense regions.
  target_alpha: 0.30
  projection_alpha: 0.90
