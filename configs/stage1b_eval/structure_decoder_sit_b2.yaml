stage: stage1b_eval_quick
project_root: /data/not_backed_up/yxu209/diffusion-ot/
output_dir: outputs/stage1b_eval_pcgrad
seed: 20260906
alignment_device: cuda:0

data:
  reference_split: train
  # Eq. (7) is fit on the reference subset and averaged over this larger bank.
  projection_split: train
  query_split: val
  reference_samples_per_domain: 512
  projection_samples_per_domain: all
  query_samples_per_domain: 256
  batch_size: 32
  num_workers: 4
  pin_memory: true

# JSONL rows include viewpoint, framing, and a shared cross-domain coat color.
# Example: {"sample_id": "...", "viewpoint": "front", "framing": "close_up",
#           "coat_color": "black"}.
# The relative path resolves under project_root, currently
# /data/not_backed_up/yxu209/diffusion-ot/. The file must exist and contain
# labels for the sample IDs whose UMAP colors are required.
proxy_labels:
  path: data/proxy_labels/afhq_viewpoint_framing.jsonl
  attributes: [viewpoint, framing, coat_color]
  sample_id_key: sample_id

matching:
  normalize: l2
  # Match InfoOT.compute_kernel on the transported reference bank.
  distance_scale: infoot_rms
  # Match the structure-guided fused training pilot.
  bandwidth_multiplier: 0.55
  # Conditional Eq. (7) projection readouts only. The Stage 1A sweep found
  # 0.10 at the useful knee: about 23-25 effective targets, before the marked
  # norm shrinkage and support growth at 0.15 and above.
  # CLI overrides remain available for sensitivity checks.
  projection_bandwidth_multiplier: 0.10

infoot:
  variant: fused
  cross_cost_weight: 1.0
  algorithm: official_projected_sinkhorn
  mi_weight: 0.10
  entropy_epsilon: 0.02
  inner_iterations: 1200  # Match training; retain early stopping and the same tolerance.
  projection_iterations: 2000
  projection_tolerance: 0.00001
  outer_tolerance: 0.00001
  min_inner_iterations: 5
  outer_patience: 3
  strict_convergence: true
  require_outer_convergence: true
  initialization: independent_product
  numerical_epsilon: 0.00000001

projection:
  directions: [cat_to_dog, dog_to_cat]

reconstruction:
  enabled: true
  # Pixel/LPIPS targets are original dataset RGB images after cache preprocessing.
  # VAE reconstruction error is reported separately; Stage 1A is not the target.
  # Use a larger held-out panel for checkpoint/LR decisions; re-evaluate controls
  # with the same panel. This increases evaluation sampling time and memory.
  samples_per_domain: 32
  num_steps: 20
  guidance_scale: 1.0
  metrics: [latent_mse, pixel_mse, pixel_psnr, lpips]

translation:
  enabled: true
  decoded_structure_metrics: true
  # One row of conditional generations per direction, with 16 examples.
  include_source: false
  include_structure_teacher_mean: false
  samples_per_direction: 16
  num_steps: 20
  guidance_scale: 1.0
  readouts: [conditional_mean]
  primary_readout: conditional_mean
  temperature: 1.0

comparison:
  # Standalone diagnostics are allowed; compare only when a matching baseline exists.
  require_stage1a_baseline: false

visualization:
  enabled: true
  method: umap
  random_state: 20260906
  # A fixed seed makes UMAP deterministic and therefore single-threaded.
  n_jobs: 1
  # Target-bank points remain translucent while larger, outlined projection
  # markers stay legible over dense regions.
  target_alpha: 0.30
  projection_alpha: 0.90
