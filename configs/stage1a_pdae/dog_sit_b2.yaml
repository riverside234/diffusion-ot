stage: stage1a_pdae
project_root: /data/not_backed_up/yxu209/diffusion-ot/
domain: dog
split: train
data_config: configs/data/afhq_huggan.yaml
model_config: configs/model/sit_b2_256.yaml
output_dir: outputs/stage1a_dog_sit_b2
device: cuda:1
torch_dtype: float32

dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: true
  drop_last: true

train:
  max_steps: 1000
  seed: 20260901
  lr_encoder: 0.0001
  lr_adapter: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  log_every: 20
  save_every: 500

flow:
  direction: noise_to_data
  time_eps: 0.00001

class_conditioning:
  mode: null
  null_label: 1000

encoder:
  input_channels: 4
  channels: [64, 128, 256]
  spatial_size: 4
  z_dim: 512
  num_groups: 32
  normalize_z: true

adapter:
  freeze_base: true
  injection_layers: [4, 5, 6, 7, 8, 9, 10, 11]
  bottleneck_dim: 64

loss_weighting:
  type: pdae_flow_snr
  gamma: 0.25
  normalize_mean_to: 1.0
  clamp_min: 0.05
  clamp_max: 5.0
