stage: stage1b_fused_infoot
# DINO-feature GAN control; histogram is validation-only. Same seeds/panels as PatchGAN.
# Rationale and task definitions: docs/analysis/stage1b_minimal_pcgrad/review.md.
# Previous full recipe: structure_decoder_full_sit_b2.yaml.
# DiffAugment contract: docs/analysis/stage1b_diffaugment/review.md.
project_root: /data/not_backed_up/yxu209/diffusion-ot/
output_dir: outputs/stage1b_dino_control

stage1a:
  # Initialize from the current Flow + DINO Stage 1A runs.
  weights: ema
  require_semantic_cfg: true
  require_attention_lora: true
  require_attention_lora_rank: 64
  require_attention_lora_alpha: 64
  cat:
    config: configs/stage1a_pdae/cat_sit_b2_dino.yaml
    checkpoint: outputs/stage1a_cat_dino/checkpoints/latest.pt
    device: cuda:0  # Experiment D keeps both branches on one GPU.
  dog:
    config: configs/stage1a_pdae/dog_sit_b2_dino.yaml
    checkpoint: outputs/stage1a_dog_dino/checkpoints/latest.pt
    device: cuda:0

data:
  split: train
  transport_batch_size: 128
  # Native flow loss is batch-averaged; this need not match decoded batch_size.
  reconstruction_batch_size: 64
  random_horizontal_flip: 0.0  # Matches the unflipped structure cache.
  num_workers: 4
  pin_memory: true
  drop_last: true

train:
  max_steps: 4000  # Includes 2,000 updates after the decoded ramp reaches full weight.
  smoke_steps: 500
  seed: 20260905
  lr_encoder: 0.00002
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  log_every: 100
  gradient_diagnostics_every: 200  # Also a logged step; keep gradients visible.
  gradient_conflicts: true  # Per-domain diagnostics before PCGrad; surgery also reports actual changes.
  save_every: 500  # Preserve every fixed-validation candidate.
  resume_from: null
  loss_window: 100
  validation_every: 500
  # Native real-data flow probe count; decoded training/probe uses batch_size below (32).
  # Re-evaluate old checkpoints with this panel before comparing native losses.
  validation_samples: 32
  keep_step_checkpoints: true

ema:
  enabled: true
  decay: 0.995  # About 200 updates of EMA history; tracked with the matching heads throughout the run.
  warmup_steps: 500
  update_every: 1

loss_weights:
  cat_reconstruction: 1.0
  dog_reconstruction: 1.0
  # Keep the coefficient on -MI at 0.02: outer 0.20 * inner lambda 0.10.
  infoot_alignment: 0.20
  latent_anchor: 0.0  # Native flow uses real data; no initial-code teacher constraint.
  semantic_neighborhood: 0.0  # Retain direct conditional supervision instead.
  conditional_structure: 0.02
  projection_support: 0.0
  alignment_warmup_steps: 1000

matching:
  normalize: l2
  calibration_samples: 256
  # Match InfoOT.compute_kernel: sqrt(mean(pairwise_distance^2) / 2).
  distance_scale: infoot_rms
  # Differentiate the RMS estimate in neural losses as well as distances.
  # The revised protection recipe starts fresh from Stage 1A initialization.
  # The original run is preserved by structure_decoder_detached_sit_b2.yaml.
  distance_scale_gradient: full
  bandwidth_multiplier: 0.55

infoot:
  variant: fused
  cross_cost_weight: 1.0
  algorithm: official_projected_sinkhorn
  mi_weight: 0.10  # Weaker MI feedback in the inner plan; fixed structure cost remains 1.0.
  entropy_epsilon: 0.02
  inner_iterations: 1200  # Outer cap; slow batches may need >300. Stop early once converged.
  recovery_iterations: 4800  # Match active training's bounded FP64 recovery after the normal cap.
  projection_iterations: 10000  # Match active training's Sinkhorn cap and strict marginal tolerance.
  projection_tolerance: 0.00001
  outer_tolerance: 0.00001
  min_inner_iterations: 5
  outer_patience: 3
  strict_convergence: true
  require_outer_convergence: true  # Feasible marginals alone are insufficient.
  initialization: independent_product
  numerical_epsilon: 0.00000001

trainable:
  encoders: true
  adapters: true
  attention_lora: true
  base_transformers: false

quick_evaluation:
  config: configs/stage1b_eval/structure_decoder_sit_b2.yaml
  weights: ema
  # --quick-eval measures initialization and final paired EMA weights using
  # fixed native/translation panels. Native image metrics target original RGB.

# Frozen DINOv2 pooled patch self-similarity; no proxy labels enter training.
semantic_prior:
  path: data/semantic_priors/afhq_dinov2_structure.pt
  # Relative squared distances: contraction cannot flatten neighbor logits.
  # Pair with variance/covariance protection; start fresh from Stage 1A.
  neighborhood_geometry: rms_distance
  neighborhood_temperature: 0.20

# Project extension: teach Eq. (7) on queries excluded from the current OT fit.
# 128 encoded samples/domain = 96 fit references + 32 disjoint queries.
conditional_structure:
  enabled: true
  query_samples_per_domain: 32
  bandwidth_multiplier: 0.10  # Match the quick evaluator's conditional readout.
  teacher_temperature: 0.05  # On the fixed, training-calibrated structure cost.
  validation_reference_samples: 96
  validation_query_samples: 32

# PCGrad treats weighted tasks symmetrically, separately on E / matching H / G.
# Random ordering is reproducible from train.seed and step; no model RNG draws.
# Sum reduction preserves the existing weighted-sum scale when there is no conflict.
pcgrad:
  enabled: true
  eps: 0.000000000001

# Superseded by PCGrad; no reconstruction-priority cap or norm-ratio controller.
gradient_guard:
  enabled: false
decoded_encoder_balance:
  enabled: false

# Extra matching contrasts disabled; conditional KL retains the full teacher.
matching_contrastive:
  enabled: false

# Disabled in this experiment: the 8k run's support divergence increased.
# The implementation and prior config remain available as controls.
projection_support:
  enabled: false
  regularization: 0.10
  max_iterations: 2000
  tolerance: 0.00001

# Project extension: InfoOT kernels use m(z); adapted generators consume raw z.
# Normalized identity at initialization; heads have their own Adam parameter
# group and EMA, paired with the adapted generators.
matching_head:
  enabled: true
  kind: residual_mlp_v1
  input_dim: 512
  hidden_dim: 256
  lr: 0.0002
  grad_clip_norm: 1.0


# VICReg-inspired protection of post-L2 OT references, independently per domain.
# Loss uses sqrt(feature_dim) * m(z), population covariance, and the MEAN
# squared off-diagonal entry. Active from step 1 without alignment warmup.
# The fit-0.55 pilot is preserved as structure_decoder_fit055_control_sit_b2.yaml.
# Retain these strengths: previous logs still show incomplete floor coverage.
# Rank recovery and decoded quality still require a matched AFHQ pilot.
matching_regularization:
  enabled: true
  std_target: 0.70
  variance_weight: 0.05
  covariance_weight: 0.01
  eps: 0.0001

# Experiment D: freeze pretrained SiT/VAE/null token, adapt all added G layers.
generator_adaptation:
  enabled: true
  # Modest LoRA-only LR trial; compare against 2.5e-6 at the same 64/32 batches.
  # Mixed objective batch sizes do not imply a global Adam LR multiplier.
  lr_adapter: 0.000005
  lr_lora: 0.00000375
  grad_clip_norm: 1.0
  null_preservation_weight: 0.0  # Native flow with semantic dropout still trains the null path.
  # Native reconstruction is supervised by real-data flow targets. Stage 1A
  # predictions are imperfect and are not the target for native synthesis.
  conditioned_preservation_weight: 0.0
  conditioned_preservation_samples: 4

# Actual translated images enter the image objectives. No top-k or sampled-code
# substitute. DINOv2 weights/revision/processor come from semantic_prior.path.
# Target realism uses separate spectral-normalized DINO feature discriminators.
decoded_translation:
  enabled: true
  # Decode all 32 disjoint queries; independent of the native reconstruction batch.
  # A 64-query trial needs transport_batch_size=160 to retain 96 fit references.
  batch_size: 32
  num_steps: 20
  validation_num_steps: 20
  guidance_scale: 1.0
  every_steps: 1
  start_step: 0
  warmup_steps: 2000
  structure_weight: 0.0  # Structure cosine is diagnostic only.
  # Retrieve the original source among the current 32 source query images.
  # Similarity: half CLS + half mean corresponding-patch cosine. Keys detached.
  # InfoNCE replaces perceptual cosine; neither is a direct RGB-color constraint.
  # Retain the requested 0.10 as a pilot; cosine and InfoNCE scales differ.
  perceptual_weight: 0.10
  perceptual_mode: contrastive
  perceptual_temperature: 0.20
  perceptual_negative_similarity_threshold: 0.95
  adversarial_weight: 0.01
  # HistoGAN RGB-uv / inverse-quadratic kernel; source is original whole-image RGB.
  # Same 2,000-step decoded ramp. Weight-zero controls still log validation distance.
  color_histogram:
    weight: 0.0
    bins: 64
    input_size: 128
    sigma: 0.02
  save_validation_images: true
  # One source-image objective: perceptual InfoNCE already includes spatial tokens.
  structure_contrastive_weight: 0.0
  # No established Stage 1B quality gain from the extra code-retrieval objective.
  code_consistency_weight: 0.0
  discriminator_lr: 0.0001
  discriminator_hidden_dim: 256
  discriminator_grad_clip: 1.0
  # Image-space DiffAugment on real/fake adversarial inputs before frozen DINO.
  # Independent integer shifts, zero fill; no color changes. Validation is unaugmented.
  diffaugment:
    enabled: true
    policy: translation
    translation_ratio: 0.0625
  checkpoint_sampler: true
  checkpoint_features: true
