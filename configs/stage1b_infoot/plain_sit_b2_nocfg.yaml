# Compatibility protocol for the completed pre-semantic-CFG Stage 1A checkpoints.
stage: stage1b_plain_infoot
project_root: /data/not_backed_up/yxu209/diffusion-ot/
output_dir: outputs/stage1b_cat_dog_plain_infoot_sit_b2_nocfg

stage1a:
  weights: ema
  require_semantic_cfg: false
  require_attention_lora: false
  cat:
    config: configs/stage1a_pdae/cat_sit_b2_nocfg.yaml
    checkpoint: outputs/stage1a_cat_sit_b2/checkpoints/latest.pt
    device: cuda:0
  dog:
    config: configs/stage1a_pdae/dog_sit_b2_nocfg.yaml
    checkpoint: outputs/stage1a_dog_sit_b2/checkpoints/latest.pt
    device: cuda:1

data:
  split: train
  transport_batch_size: 64
  reconstruction_batch_size: 8
  random_horizontal_flip: 0.5
  num_workers: 4
  pin_memory: true
  drop_last: true

train:
  max_steps: 5000
  smoke_steps: 500
  seed: 20260905
  lr_encoder: 0.00002
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  log_every: 20
  gradient_diagnostics_every: 200
  save_every: 500
  resume_from: null

ema:
  enabled: true
  decay: 0.9999
  warmup_steps: 500
  update_every: 1

loss_weights:
  cat_reconstruction: 1.0
  dog_reconstruction: 1.0
  infoot_alignment: 0.02
  latent_anchor: 0.01
  alignment_warmup_steps: 1000

matching:
  normalize: l2
  calibration_samples: 256
  distance_scale: fixed_stage1a_median
  bandwidth_multiplier: 1.0

infoot:
  variant: plain
  mi_weight: 1.0
  entropy_epsilon: 0.05
  inner_iterations: 50
  projection_iterations: 200
  projection_tolerance: 0.00001
  step_size: 0.25
  gradient_clip: 50.0
  restarts: 3
  initialization: seeded_nonindependent_feasible
  numerical_epsilon: 0.00000001

trainable:
  encoders: true
  adapters: false
  attention_lora: false
  base_transformers: false

quick_evaluation:
  config: configs/stage1b_eval/quick_sit_b2.yaml
  weights: ema
