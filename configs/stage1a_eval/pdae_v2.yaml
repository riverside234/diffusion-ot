stage: stage1a_eval
project_root: /data/not_backed_up/yxu209/diffusion-ot/
device: cuda:0
weights: raw  # Cat 10k: raw outperforms the old EMA; --weights both compares them.
split: val
seed: 20260902

architecture:
  require_encoder_kind: siglip2_vit_b16
  require_encoder_input_space: rgb
  require_semantic_cfg: true
  require_attention_lora: true
  require_attention_lora_rank: 64
  require_attention_lora_alpha: 64

dataset:
  smoke_samples: 8
  batch_size: 8
  num_workers: 4

sampling:
  solver: euler
  direction: noise_to_data
  time_evaluation: midpoint
  smoke_num_steps: 50
  guidance_scales: [0.0, 1.0, 1.5, 2.0]
  variants: [correct_z, shuffled_z, null_z]
  fixed_starting_noise: true
  inferred_noise:
    enabled: false  # Optional inversion/reconstruction diagnostic: pass --roundtrip to run it.
    num_steps: 100
    guidance_scale: 1.0
    variants: [correct_z, shuffled_z, null_z]

metrics:
  image_reference: original_rgb
  smoke: [latent_mse, pixel_mse, pixel_psnr]

output:
  subdir: pdae_v2_eval
  save_individual_images: false
  save_sample_records: true

# The existing ridge probe expects [B,D] codes; never pool patch conditions for it.
input_statistics:
  enabled: false
