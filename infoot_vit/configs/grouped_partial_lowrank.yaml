# Separate experiment: selected per-image-pair PARTIAL InfoOT, no co-training.
mode: grouped_partial_lowrank
source_bank: data/infoot_vit/cat_train
target_bank: data/infoot_vit/dog_train
device: cuda
threads: 4
sampling:
  images_per_domain: 2000
  seed: 42
fit_pair_top_k: 8  # null for all pairs; resource guard applies.
# Per-pair ranks: 64 keeps 16,000 factor triples below the 4 GB budget.
# The global balanced experiment retains rank 256 for both factorizations.
transport_rank: 64
kernel_rank: 64
partial:
  keep_mass: 0.8
image_solver:
  h: 0.4
  lam: 0.1
  reg: 0.05
  cost_scale: mean
  max_outer_steps: 300
  max_inner_steps: 10000
kernel:
  h: 0.4
  seed: 4201
  check_pairs: 4096
  density_queries: 32
  error_warn_relative_rmse: 0.5
estimator:
  seed: 4202
  samples_per_row: 2
  audit_samples: 2048
  exact: false
optimizer:
  seed: 4203
  lam: 0.1
  reg: 0.05
  step_size: 1.0
  max_steps: 300
  max_backtracks: 12
  projection_iterations: 10000
  projection_tolerance: 1.0e-12
  constraint_tolerance: 1.0e-8
  min_g: 1.0e-10
  stationarity_tolerance: 1.0e-6
  objective_tolerance: 1.0e-12
  log_floor: 1.0e-300
  chunk_size: 4096
  audit_every: 25
  checkpoint_every: 25
  log_every: 25
projection:
  bandwidth_multiplier: 1.0
  selection: mean
  top_k_images: null
  seed: 42
  query_chunk_size: 1
  target_chunk_size: 8
  patch_chunk_size: 64
  confidence:
    support_calibration: fit_leave_one_out_log_density
    support_quantile: 0.01
    support_log_threshold: -100.0
    threshold: 0.05
    mass_floor: 1.0e-12
    all_invalid_policy: error
resources:
  max_artifact_bytes: 4000000000
  max_working_gib: 64
