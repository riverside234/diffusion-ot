# Independent experiment; all existing mode configs/artifacts remain usable.
mode: grouped_patch_lowrank
source_bank: data/infoot_vit/cat_train
target_bank: data/infoot_vit/dog_train
sampling:
  images_per_domain: 2000
  seed: 42
transport_rank: 256
kernel_rank: 1024
device: cuda  # Explicit --device cpu remains supported; no silent GPU fallback.
threads: 4
image_solver:
  h: 0.7  # Requested fit bandwidth; projection uses 0.2.
  lam: 0.075  # Retain router MI while reducing entropic averaging; h=.7 trial, not a validated optimum.
  reg: 0.05  # Was .075; start a fresh fit for changed objective weights.
  cost_scale: mean
  max_outer_steps: 1200
  max_inner_steps: 10000
  outer_tolerance: 1.0e-7  # Keep the original stationarity requirement.
kernel:
  method: normalized_positive_gaussian_v1  # Selected by repeated synthetic audits; real-bank acceptance still required.
  orthogonal: false  # Original IID construction; PRF/OPRF remain comparison options.
  h: 0.7  # Fit KDE; independently audited projection KDE uses h=0.2.
  seed: 4201
  check_pairs: 4096
  density_queries: 32
  error_warn_relative_rmse: 0.5
  error_policy: error  # Reject inaccurate kernels before image-router/patch fitting.
  max_relative_rmse: 0.5
  max_density_relative_error_mean: 0.25
  max_density_relative_error_max: 1.0
  reference_images: 4
  reference_patches_per_image: 32  # <=128 support patches/domain, exact Gaussian audit only.
  reference_queries: 16
estimator:
  seed: 4202
  samples_per_row: 2  # Both source- and target-stratified pairs; 1,568,000 samples.
  audit_samples: 32768
  exact: false  # Tiny dense-reference tests only; never use for full banks.
optimizer:
  seed: 4203
  lam: 0.05  # Was .10; halve MI with entropy, preserving their ratio and emphasizing geometric cost.
  reg: 0.025  # Was .05; less patch-plan averaging with broad h=.7 kernels.
  step_size: 1.0
  max_steps: 300
  max_backtracks: 12
  projection_iterations: 10000
  projection_tolerance: 1.0e-12
  constraint_tolerance: 1.0e-8
  min_g: 1.0e-10
  stationarity_tolerance: 1.0e-6
  objective_tolerance: 1.0e-12
  log_floor: 1.0e-300
  chunk_size: 4096
  audit_every: 10
  checkpoint_every: 10
  log_every: 1
projection:
  bandwidth_multiplier: 0.2857142857142857 # 0.2 / 0.7; router and patch projection h=0.2
  selection: mean
  top_k_images: null
  seed: 42
  query_chunk_size: 1
  target_chunk_size: 8
  patch_chunk_size: 64
resources:
  max_artifact_bytes: 5000000000  # 5 decimal GB; rank-256/1024 estimate is 4.35 GB, including logs.
  max_working_gib: 64
