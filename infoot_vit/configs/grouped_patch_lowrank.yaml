# Independent experiment; all existing mode configs/artifacts remain usable.
mode: grouped_patch_lowrank
source_bank: data/infoot_vit/cat_train
target_bank: data/infoot_vit/dog_train
sampling:
  images_per_domain: 2000
  seed: 42
transport_rank: 256
kernel_rank: 256
device: cuda  # Explicit --device cpu remains supported; no silent GPU fallback.
threads: 4
image_solver:
  h: 0.4  # Keep locality; the supplied log does not justify broader kernels.
  lam: 0.075  # Reduce router MI/entropy ratio from 2.0 to 1.0.
  reg: 0.075
  cost_scale: mean
  max_outer_steps: 1200
  max_inner_steps: 10000
  outer_tolerance: 1.0e-7  # Keep the original stationarity requirement.
kernel:
  h: 0.4
  seed: 4201
  check_pairs: 4096
  density_queries: 32
  error_warn_relative_rmse: 0.5
estimator:
  seed: 4202
  samples_per_row: 2  # Both source- and target-stratified pairs; 1,568,000 samples.
  audit_samples: 32768
  exact: false  # Tiny dense-reference tests only; never use for full banks.
optimizer:
  seed: 4203
  lam: 0.1
  reg: 0.05
  step_size: 1.0
  max_steps: 300
  max_backtracks: 12
  projection_iterations: 10000
  projection_tolerance: 1.0e-12
  constraint_tolerance: 1.0e-8
  min_g: 1.0e-10
  stationarity_tolerance: 1.0e-6
  objective_tolerance: 1.0e-12
  log_floor: 1.0e-300
  chunk_size: 4096
  audit_every: 10
  checkpoint_every: 10
  log_every: 1
projection:
  bandwidth_multiplier: 1.0
  selection: mean
  top_k_images: null
  seed: 42
  query_chunk_size: 1
  target_chunk_size: 8
  patch_chunk_size: 64
resources:
  max_artifact_bytes: 4000000000  # Decimal GB; completed directory including logs.
  max_working_gib: 64
