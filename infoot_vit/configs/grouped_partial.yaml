# Storage-efficient experiment: 2000 seeded images/domain; 8 saved pairs/source.
mode: grouped_partial
device: cuda
pair_batch_size: 2048  # Independent exact [B,196,196] partial InfoOT solves; null = serial POT.
pair_checkpoint_every: 10  # Outer iterations; first and every terminal state are always saved.
pair_failure_abort_batches: 1  # Stop a systemic failure after one fully failed batch; null disables.
source_bank: data/infoot_vit/cat_train
target_bank: data/infoot_vit/dog_train
sampling:
  images_per_domain: 2000  # Exactly this many, no replacement or silent reduction.
  seed: 42
fit_pair_top_k: 8  # null = full pairs; K >= target count is equivalent to full.
solver:  # Working baseline for full mapping; reg=.0575 raised normalized top-1 to 98.40%.
  h: 0.36  # Hold the neighborhood geometry and .20/.20 projection fixed.
  lam: 0.070  # Hold MI fixed pending patch-plan and held-out image diagnostics.
  reg: 0.06  # Restore measured baseline: 69.21% retained mass, 94.47% normalized top-1.
  cost_scale: mean
  max_outer_steps: 1200
  max_inner_steps: 10000
  inner_tolerance: 1.0e-10
  feasibility_tolerance: 1.0e-8
  outer_tolerance: 1.0e-7  # Keep the fixed-point check strict; do not accept a budget stop.
partial:
  keep_mass: 0.80  # Preserve more condition coverage; transported mass, NOT a patch count.
  solver:  # Next sampled trial: increase entropy only at the measured lam=.035.
    h: 0.35  # Hold fitted KDE geometry fixed for the entropy/MI tradeoff.
    lam: 0.035  # Hold MI fixed; reg=.0375 converged 64/64 in <=111 outer steps.
    reg: 0.040  # Unmeasured at lam=.035: test whether +6.7% entropy reduces solver work.
    # reg=.0375 baseline: 15.23 effective patches, variance .6835, coverage 98.25%, solver 382.7 s.
    # Compare reg=.0375/.040 at lam=.035 on the same solver version; timings depend on GPU load.
    # Compare the same saved selection and 64 pairs (seed 42); then held-out images.
    cost_scale: mean
    max_outer_steps: 600
    max_inner_steps: 20000  # Hard ceiling; certified members stop independently.
    inner_acceleration: newton  # Safeguarded capped-mass dual Newton after 100 block updates.
    newton_batch_size: 128  # Bounded linear-algebra sub-batch; benchmark 64/128/256 on the lab GPU.
    newton_check_every: 5  # Stop backtracking when all valid members have accepted.
    inner_compact: true  # Remove retired members when at least 25% of a work batch is inactive.
    inner_warm_start: true  # Reuse dual potentials across outer steps; certificates remain strict.
    inner_tolerance: 1.0e-10  # Unchanged primal/KKT/gap certificate; no budget-stop acceptance.
    feasibility_tolerance: 1.0e-8
    mass_tolerance: 1.0e-8
    outer_tolerance: 1.0e-7
projection:
  bandwidth_multiplier: 0.5555555555555556  # .20/.36: image projection AND pair selection stay at .20.
  patch_bandwidth: 0.20  # Absolute patch projection h; independent of image bandwidth.
  selection: mean
  top_k_images: null
  seed: 0
  query_chunk_size: 4
  confidence:
    support_calibration: fit_leave_one_out_log_density
    support_quantile: 0.01  # Fit-only heuristic, not semantic correctness.
    threshold: 0.05  # Hold: current valid-token coverage is 95.12%; no all-invalid images.
    mass_floor: 1.0e-12
    all_invalid_policy: error
resources:
  max_working_gib: 90  # Estimate guard only; not a GPU memory reservation or physical capacity.
  max_plan_gib: 64
