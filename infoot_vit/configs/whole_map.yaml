# First baseline: complete feature maps are the OT samples. No co-training.
mode: whole_map
device: cuda
source_bank: data/infoot_vit/cat_train
target_bank: data/infoot_vit/dog_train
solver:
  h: 0.35
  lam: 0.075  # Restore the baseline MI weight.
  reg: 0.06
  # Explicit training-mean EUCLIDEAN cost normalization; raw feature values stay unchanged.
  # Keep h/reg fixed for the MI-weight comparison.
  cost_scale: mean
  max_outer_steps: 1200  # Reviewed run converged at 638; 300 stopped too early.
  max_inner_steps: 10000
projection:
  bandwidth_multiplier: 0.2857142857142857  # Fit h=0.35 -> projection h=0.10 (was 0.21).
  selection: mean
  top_k_images: null
  seed: 0
  query_chunk_size: 4
resources:
  max_working_gib: 90
  max_plan_gib: 64
